name: Lint

# プラグインの外にあるドキュメントだけの変更では動かさない。**.md でまとめて除外しないのは、
# plugins/ の SKILL.md やテンプレートの .md をテストで使っているため。
# 将来ルールセットで CI の成功を必須にするときは、paths-ignore で動かなかった PR のチェックが
# 「待ち」のまま残ってマージできなくなるので、paths-ignore をやめるなどの対応が要る。
# .github/workflows/** は入れない（ワークフローを変えた PR で actionlint を動かすため）。
# paths-ignore は test.yml と同じリストにそろえず、lint が何を検査するかで決める。
on:
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md

# 同じ PR に続けて push したら、古い実行を取り消す。main への push は PR のときとの差を
# 確かめるために残すので、コミットごとに別のグループにして取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          # tests/lib は外部のライブラリ（git submodule）なので対象にしない
          find plugins tests -path tests/lib -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 2>/dev/null \
            | xargs -0 -r shellcheck -x
          shellcheck -s bash tests/*.bats
      - name: actionlint
        # ワークフローのキー・式と、run: の中のスクリプト（shellcheck）を検査する。この lint.yml 自身も対象に入る
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: non-ASCII right after $var
        # macOS の bash 3.2 は "$var」" のように日本語が続くと、その文字のバイトまで変数名とみなすので "${var}」" と書く
        run: |
          if grep -rnP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' --include='*.sh' --include='*.bash' --exclude-dir='bats-*' plugins tests | grep -vP '^[^:]+:\d+:\s*#'; then
            # ${var} は展開せず、書き方の例としてそのまま出す
            # shellcheck disable=SC2016
            echo '日本語などの直前の変数は ${var} と波括弧で囲んでください' >&2
            exit 1
          fi
      - name: old config locations
        # 設定・ガイド・観点は .claude/dev-workflow/ に移した（#93）。古い置き場所を参照するテストやスクリプトは、
        # 設定が読まれずに失敗したり、思ったとおりに動かなかったりする。
        # 古い置き場所を知らせる doctor.sh とそのテスト、release-please が書く CHANGELOG は除く。
        # grep -r の --exclude-dir・--exclude は名前だけで照合し、scripts/lib/ なども外れてしまうので、
        # パスで除ける git grep を使う（git grep は submodule の tests/lib の中を見ない）。
        # .claude/workflows/ は Claude Code 本体の置き場所なので、workflow の後に英字が続くものは対象にしない
        # git grep は見つからなければ 1、失敗（正規表現の誤りなど）すれば 128 で終わる。失敗を「見つからない」と
        # 取り違えて検査せずに通らないように、1 より大きければ失敗させる
        run: |
          rc=0
          git grep -nP '\.claude/(workflow|review)(?![A-Za-z])|\.claude/labels\.json|workflow\.local\.json' -- plugins tests \
            ':!*CHANGELOG.md' ':!plugins/dev-workflow/scripts/doctor.sh' ':!tests/doctor.bats' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo '古い置き場所を参照しています。.claude/dev-workflow/ の下（config.json・config.local.json・review/・labels.json）を使ってください' >&2
            exit 1
          fi
          [ "$rc" -eq 1 ] || exit "$rc"
      - name: plugin manifest
        run: |
          jq empty .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/defaults/*.json \
            release-please-config.json .release-please-manifest.json
      - name: claude plugin validate
        # Claude Code がマニフェストとスキルを受け付けるかを検査する。マーケットプレイス（.）だけを指定すると
        # plugin.json までしか検査されず、スキル（SKILL.md）などは検査されないので、プラグイン本体も指定する。
        # --strict で知らないキーなどの警告もエラーにする。
        # 更新で検査が厳しくなって急に落ちないように、バージョンを固定する。上げるときは手元で両方が通ることを確かめる。
        # validate はログインしなくても動く
        env:
          CLAUDE_CODE_VERSION: 2.1.288
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude plugin validate --strict .
          claude plugin validate --strict plugins/dev-workflow
      - name: plugin version
        # version は release-please がリリース PR で manifest と plugin.json を同時に上げる。手で plugin.json だけを変えると食い違う
        run: |
          manifest="$(jq -r '."plugins/dev-workflow"' .release-please-manifest.json)"
          plugin="$(jq -r .version plugins/dev-workflow/.claude-plugin/plugin.json)"
          if [ "$manifest" != "$plugin" ]; then
            echo "plugin.json の version（${plugin}）が .release-please-manifest.json（${manifest}）と違います。version は release-please が上げるので、手で変えないでください" >&2
            exit 1
          fi
