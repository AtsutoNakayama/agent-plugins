name: Lint

# ドキュメントだけの変更では、重いジョブを飛ばす（changes ジョブが判定する）。ワークフロー自体は paths-ignore で
# 止めず、いつも動かす。ルールセットの必須のチェックにしているので、ワークフローが動かないとチェックが
# 「待ち」のまま残ってマージできないため。必須のチェックは、最後に必ず動く lint-result ジョブ。
# 何をドキュメントとするかは、.github/scripts/docs-only.sh にある。
# マージキューに入れた PR は、merge_group のイベントでも動かす（キューの結果で必須のチェックが決まる）。
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# 同じ PR に続けて push したら、古い実行を取り消す。main への push は PR のときとの差を
# 確かめるために残すので、コミットごとに別のグループにして取り消さない。
# merge_group も、キューの1件ごとのコミット（github.sha）で別のグループになり、取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # ドキュメントだけの変更かを調べる。pull_request ではマージコミット（HEAD^ が main の先端）、push では
    # main に入ったコミットを見るので、直前の1つ前まで取得する。
    # merge_group では、キューの先頭側のコミット（merge_group.base_sha）から HEAD までを見る
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: docs only
        id: docs-only
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          echo "docs_only=$(.github/scripts/docs-only.sh | jq -r .docs_only)" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install shellcheck
        # ランナーに最初から入っている shellcheck は、イメージの更新で知らないうちに変わり、手元の版とも違うので使わない。
        # 公式のリリースから決めた版を入れる。リリースにはチェックサムが無いので、取得した物のハッシュをここに書いて確かめる。
        # 上げるときは、CONTRIBUTING.md の「テストとチェック」の版（本文と Docker のイメージのタグ）もそろえ、手元でその版の shellcheck が通ることを確かめる
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: shellcheck
        run: |
          # 入れた版で動いていることをログに残す
          shellcheck --version
          # find が失敗したら（ディレクトリが無いなど）、検査したことにせず止める
          set -o pipefail
          # tests/lib は外部のライブラリ（git submodule）なので対象にしない
          find plugins tests .github/scripts -path tests/lib -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 -r shellcheck -x
          shellcheck -s bash tests/*.bats
      - name: actionlint
        # ワークフローのキー・式と、run: の中のスクリプト（shellcheck）を検査する。この lint.yml 自身も対象に入る
        # run: の検査には、上で入れた shellcheck ではなく、イメージに入っている shellcheck を使う（1.7.12 では 0.11.0）。
        # イメージのタグを上げると、その shellcheck の版も変わる
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: non-ASCII right after $var
        # macOS の bash 3.2 は "$var」" のように日本語が続くと、その文字のバイトまで変数名とみなすので "${var}」" と書く
        # コメントの行は除く。grep の終了コードは 0 が見つかった、1 が見つからない、2 以上が失敗（正規表現の誤り・-P が使えないなど）。
        # 失敗を「見つからない」と取り違えて通らないように、パイプでつながず grep 1つで調べて終了コードを見分ける
        run: |
          rc=0
          grep -rnP '^(?!\s*#).*\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' --include='*.sh' --include='*.bash' --exclude-dir='bats-*' plugins tests .github/scripts || rc=$?
          case "$rc" in
            0)
              # ${var} は展開せず、書き方の例としてそのまま出す
              # shellcheck disable=SC2016
              echo '日本語などの直前の変数は ${var} と波括弧で囲んでください' >&2
              exit 1
              ;;
            1) ;;
            *)
              echo "grep が失敗しました（終了コード ${rc}）。検査できていません" >&2
              exit 1
              ;;
          esac
      - name: plugin manifest
        run: |
          jq empty .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/defaults/*.json \
            release-please-config.json .release-please-manifest.json
      - name: claude plugin validate
        # Claude Code がマニフェストとスキルを受け付けるかを検査する。マーケットプレイス（.）だけを指定すると
        # plugin.json までしか検査されず、スキル（SKILL.md）などは検査されないので、プラグイン本体も指定する。
        # --strict で知らないキーなどの警告もエラーにする。
        # 更新で検査が厳しくなって急に落ちないように、バージョンを固定する。上げるときは手元で両方が通ることを確かめる。
        # validate はログインしなくても動く
        env:
          CLAUDE_CODE_VERSION: 2.1.288
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude plugin validate --strict .
          claude plugin validate --strict plugins/dev-workflow
      - name: plugin version
        # version は release-please がリリース PR で manifest と plugin.json を同時に上げる。手で plugin.json だけを変えると食い違う
        run: |
          # -e で、キーが無い（null）ときも失敗させる。両方 null で「同じ」と取り違えて通らないようにする
          manifest="$(jq -er '."plugins/dev-workflow"' .release-please-manifest.json)"
          plugin="$(jq -er .version plugins/dev-workflow/.claude-plugin/plugin.json)"
          if [ "$manifest" != "$plugin" ]; then
            echo "plugin.json の version（${plugin}）が .release-please-manifest.json（${manifest}）と違います。version は release-please が上げるので、手で変えないでください" >&2
            exit 1
          fi

  lint-result:
    # ルールセットの必須のチェック。ドキュメントだけで lint を飛ばしたときも成功にし、
    # changes か lint が失敗・取り消しになったときは失敗にする
    if: always()
    needs: [changes, lint]
    runs-on: ubuntu-latest
    steps:
      - name: result
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          JOB: ${{ needs.lint.result }}
        run: |
          echo "changes: ${CHANGES}, docs_only: ${DOCS_ONLY}, lint: ${JOB}"
          [ "$CHANGES" = success ] || exit 1
          [ "$JOB" = success ] && exit 0
          [ "$JOB" = skipped ] && [ "$DOCS_ONLY" = true ]
