name: Test

# ドキュメントだけの変更では、重いジョブを飛ばす（changes ジョブが判定する）。ワークフロー自体は paths-ignore で
# 止めず、いつも動かす。ルールセットの必須のチェックにしているので、ワークフローが動かないとチェックが
# 「待ち」のまま残ってマージできないため。必須のチェックは、最後に必ず動く test-result ジョブ。
# 何をドキュメントとするかは、.github/scripts/docs-only.sh にある。
# マージキューに入れた PR は、merge_group のイベントでも動かす（キューの結果で必須のチェックが決まる）。
# test ジョブは、.bats のファイルを OS ごとに複数のシャードに分けて並列に動かす（shard-bats.sh が所要時間の偏らない
# 分け方を決め、changes ジョブが matrix として渡す）。シャードの数は下の changes ジョブにある。
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# 同じ PR に続けて push したら、古い実行を取り消す。main への push は PR のときとの差を
# 確かめるために残すので、コミットごとに別のグループにして取り消さない。
# merge_group も、キューの1件ごとのコミット（github.sha）で別のグループになり、取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # ドキュメントだけの変更かを調べる。pull_request ではマージコミット（HEAD^ が main の先端）、push では
    # main に入ったコミットを見るので、直前の1つ前まで取得する。
    # merge_group では、キューの先頭側のコミット（merge_group.base_sha）から HEAD までを見る
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: docs only
        id: docs-only
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          echo "docs_only=$(.github/scripts/docs-only.sh | jq -r .docs_only)" >> "$GITHUB_OUTPUT"
      - name: shards
        id: shards
        # test ジョブの matrix を作る。シャードの数は、1つのシャードの固定費（準備に ubuntu で約20秒、macOS で約10秒）と、
        # 待ち時間を縮める効果の釣り合いで決める。macOS は bash 3.2 で遅く、全体の待ち時間を決めるので多めにする
        run: |
          ubuntu=$(.github/scripts/shard-bats.sh 3)
          macos=$(.github/scripts/shard-bats.sh 4)
          matrix=$(jq -cn --argjson u "$ubuntu" --argjson m "$macos" '{include: (
            [$u[] | {os: "ubuntu-latest", bash: "bash", shard: .shard, files: .files}]
            # macOS 標準の bash 3.2 で動くことを確かめる
            + [$m[] | {os: "macos-latest", bash: "/bin/bash", shard: .shard, files: .files}]
          )}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: install bats
        # macOS では bats 本体を新しい bash で動かし、対象のスクリプトだけ /bin/bash 3.2 で動かす。
        # bats --jobs には GNU parallel が要る
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bash bats-core jq parallel
          else
            sudo apt-get update && sudo apt-get install -y bats jq parallel
          fi
      - name: bats
        env:
          TEST_BASH: ${{ matrix.bash }}
          SHARD_FILES: ${{ matrix.files }}
        run: |
          "$TEST_BASH" --version | head -n 1
          # テストは git や jq の起動を待つ時間が長いので、コア数の2倍で並列に実行する
          jobs=$(( $(getconf _NPROCESSORS_ONLN) * 2 ))
          echo "jobs: $jobs"
          read -r -a files <<<"$SHARD_FILES"
          echo "files: ${#files[@]}"
          bats --jobs "$jobs" "${files[@]}"

  test-result:
    # ルールセットの必須のチェック。ドキュメントだけで test を飛ばしたときも成功にし、
    # changes か test が失敗・取り消しになったときは失敗にする。test は matrix のシャードの結果をまとめた値で、
    # すべてのシャードが成功のときだけ success になる（1つでも失敗なら failure、取り消しなら cancelled）
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: result
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          JOB: ${{ needs.test.result }}
        run: |
          echo "changes: ${CHANGES}, docs_only: ${DOCS_ONLY}, test: ${JOB}"
          [ "$CHANGES" = success ] || exit 1
          [ "$JOB" = success ] && exit 0
          [ "$JOB" = skipped ] && [ "$DOCS_ONLY" = true ]
