name: Test

# プラグインの外にあるドキュメントだけの変更では動かさない。**.md でまとめて除外しないのは、
# plugins/ の SKILL.md やテンプレートの .md をテストで使っているため。
# 将来ルールセットで CI の成功を必須にするときは、paths-ignore で動かなかった PR のチェックが
# 「待ち」のまま残ってマージできなくなるので、paths-ignore をやめるなどの対応が要る。
# paths-ignore は lint.yml と同じリストにそろえず、test が何を検査するかで決める。
on:
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md

# 同じ PR に続けて push したら、古い実行を取り消す。main への push は PR のときとの差を
# 確かめるために残すので、コミットごとに別のグループにして取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # macOS 標準の bash 3.2 で動くことを確かめる
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: install bats
        # macOS では bats 本体を新しい bash で動かし、対象のスクリプトだけ /bin/bash 3.2 で動かす
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bash bats-core jq
          else
            sudo apt-get update && sudo apt-get install -y bats jq
          fi
      - name: bats
        env:
          TEST_BASH: ${{ matrix.bash }}
        run: |
          "$TEST_BASH" --version | head -n 1
          bats tests/
