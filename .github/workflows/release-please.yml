name: release-please

# main への push ごとに、plugins/dev-workflow の変更からリリース PR を作るか更新する。
# リリース PR をマージすると、plugin.json の version を上げ、タグと GitHub Release を作る。
# GITHUB_TOKEN で作る PR では CI が動かないので、GitHub App のトークンでリリース PR を作り、リリース PR でも CI を動かす。
on:
  push:
    branches: [main]

# リリース PR・タグ・GitHub Release は App のトークンで作るので、GITHUB_TOKEN には権限を与えない
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # googleapis/release-please-action@v5 が同梱する 17.6.0 は、リリース PR の本文にコミットの
      # `Closes #N` を `closes #N` と書き写す。GitHub がそれを Issue を閉じる紐付けとみなし、
      # Project の自動化「Pull request linked to issue」が閉じた Issue を In Progress に戻すので、
      # `refs #N` と書く 17.10.4 以降の CLI を版を固定して直接実行する（docs/design.md §1）
      RELEASE_PLEASE: release-please@17.11.2
    steps:
      # release-please 17.11.2 は Node 22 以上が必要
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # App の権限（Contents・Issues・Pull requests の読み書き）とインストール先（このリポジトリだけ）は App の設定で決める（docs/design.md §1）。
      # v3 では app-id が非推奨で client-id が推奨だが、actionlint 1.7.12 は v3 の client-id を知らずエラーにするので app-id を使う。
      # actionlint が client-id に対応したら client-id に替える（GitHub は App ID と Client ID のどちらも受け付ける）
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # Action と同じく、先にマージ済みのリリース PR からリリースを作り、次にリリース PR を作るか更新する。
      # npx は依存を毎回 npm から入れるので、書き込みのできるトークンは release-please を実行するステップにだけ渡す
      - name: GitHub Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx -y "$RELEASE_PLEASE" github-release --token "$GITHUB_TOKEN" --repo-url "$GITHUB_REPOSITORY"
      - name: Release PR
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx -y "$RELEASE_PLEASE" release-pr --token "$GITHUB_TOKEN" --repo-url "$GITHUB_REPOSITORY"
